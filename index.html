<!DOCTYPE html>
<html lang="en-PH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francis Coffee Shop</title>
<style>
  body { 
    font-family: 'Poppins', sans-serif; 
    background: linear-gradient(to bottom, #f7efe5, #e7d6c4); 
    margin:0; padding:0; text-align:center;
  }
  header { 
    background:#4e342e; color:white; padding:25px; 
    font-size:1.8rem; font-weight:600;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
  }
  #loginForm { margin:20px; }
  input { padding:8px; margin:5px; border-radius:5px; border:1px solid #ccc; }
  button { 
    margin:5px 2px; padding:8px 15px; cursor:pointer; 
    background:#4e342e; color:white; border:none; border-radius:5px;
    transition: 0.3s;
  }
  button:hover { background:#6d4c41; }
  #cart { margin:15px 0; font-weight:bold; padding:10px; background:#fff8e1; border-radius:8px; display:inline-block; box-shadow:0 3px 6px rgba(0,0,0,0.2);}
  .products { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin:20px; }
  .product { background:white; border-radius:15px; padding:15px; width:200px; box-shadow:0 6px 12px rgba(0,0,0,0.15); transition:0.3s; }
  .product:hover { transform:translateY(-5px); box-shadow:0 8px 16px rgba(0,0,0,0.25); }
  .product img { width:100%; height:140px; object-fit:cover; border-radius:10px; }
  .product p { margin:10px 0; font-weight:600; }
  textarea { margin-top:20px; width:90%; max-width:400px; height:80px; border-radius:8px; padding:8px; border:1px solid #ccc; resize:none; }
  footer { background:#4e342e; color:white; padding:15px; margin-top:30px; }
</style>
</head>
<body>

<header>☕ Francis Coffee Shop ☕</header>

<!-- LOGIN -->
<div id="loginForm">
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- CART -->
<div id="cart">🛒 Items in Cart: <span id="itemCount">0</span> | Total: ₱<span id="totalPrice">0</span></div>
<button onclick="clearCart()">🧹 Clear Cart</button>

<!-- PRODUCTS -->
<div class="products">
  <div class="product">
    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80" alt="Mocha Latte">
    <p>Mocha Latte - ₱150</p>
    <button onclick="addToCart('Mocha Latte',150)">Add to Cart</button>
    <button onclick="buyNow('Mocha Latte',150)">Buy Now</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=800&q=80" alt="Cappuccino">
    <p>Cappuccino - ₱140</p>
    <button onclick="addToCart('Cappuccino',140)">Add to Cart</button>
    <button onclick="buyNow('Cappuccino',140)">Buy Now</button>
  </div>

  <div class="product">
    <img src="p.jpeg" alt="Caramel Macchiato">
    <p>Caramel Macchiato - ₱160</p>
    <button onclick="addToCart('Caramel Macchiato',160)">Add to Cart</button>
    <button onclick="buyNow('Caramel Macchiato',160)">Buy Now</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=800&q=80" alt="Iced Americano">
    <p>Iced Americano - ₱120</p>
    <button onclick="addToCart('Iced Americano',120)">Add to Cart</button>
    <button onclick="buyNow('Iced Americano',120)">Buy Now</button>
  </div>
</div>

<textarea placeholder="Drop your feedback here about my coffee shop..."></textarea>

<script>
let itemCount = 0;
let totalPrice = 0;
let loggedIn = false;

// LOGIN FUNCTION
function login(){
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  if(user === "admin" && pass === "123"){
    loggedIn = true;
    alert("Login successful! Welcome " + user);
    document.getElementById('loginForm').style.display = "none";
  } else {
    alert("Invalid username or password!");
  }
}

// CART FUNCTIONS
function addToCart(name, price){
  if(!loggedIn){ alert("Please login first!"); return; }
  itemCount++;
  totalPrice += price;
  document.getElementById('itemCount').textContent = itemCount;
  document.getElementById('totalPrice').textContent = totalPrice;
  alert(`${name} added to cart!`);
}

function buyNow(name, price){
  if(!loggedIn){ alert("Please login first!"); return; }
  alert(`Redirecting to purchase ${name} for ₱${price}`);
  window.open("https://shopee.ph/franciscoffeeshop-antipolo", "_blank");
}

function clearCart(){
  if(!loggedIn){ alert("Please login first!"); return; }
  itemCount = 0;
  totalPrice = 0;
  document.getElementById('itemCount').textContent = itemCount;
  document.getElementById('totalPrice').textContent = totalPrice;
  alert("Cart cleared! 🧹");
}
</script>

<footer>
  © 2025 Francis Coffee Shop
</footer>

</body>
</html>
